<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Select Portal</title>

<link rel="stylesheet" href="style.css">

<style>

.portal-container{

display:flex;

justify-content:center;

align-items:center;

height:80vh;

gap:40px;

}

.portal-card{

background:white;

padding:40px;

width:280px;

border-radius:10px;

box-shadow:0 5px 20px rgba(0,0,0,.2);

text-align:center;

}

.portal-card button{

margin-top:20px;

padding:12px 25px;

background:#0057B8;

color:white;

border:none;

border-radius:5px;

cursor:pointer;

font-size:18px;

}

</style>

</head>

<body>

<header>

<div class="logo">

TradeConnect

</div>

</header>

<div class="portal-container">

<div class="portal-card">

<h2>🇮🇳 Connect India</h2>

<p>Domestic Marketplace</p>

<button onclick="location.href='india.html'">

Enter

</button>

</div>

<div class="portal-card">

<h2>🌍 Connect Global</h2>

<p>Export & Import Marketplace</p>

<button onclick="location.href='global.html'">

Enter

</button>

</div>

</div>

</body>

</html>
