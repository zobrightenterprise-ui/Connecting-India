<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradeConnect | Login</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">TradeConnect</div>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
</header>

<section class="login-section">

<div class="login-card">

<h2>Welcome Back</h2>

<p class="subtitle">
Login to your Export & Import Marketplace
</p>

<form id="loginForm">

<input
type="text"
id="username"
placeholder="Username"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button type="submit">
Login
</button>

</form>

<p class="links">
<a href="#">Forgot Password?</a>
</p>

<p class="links">
Don't have an account?
<a href="#">Register</a>
</p>

</div>

</section>

<script src="script.js"></script>

</body>
</html>
